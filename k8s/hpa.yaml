apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: stream-processor-scaler
  namespace: tsoc
spec:
  scaleTargetRef:
    name: tsoc-stream-processor
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: soc-redpanda-cluster.prod.svc.cluster.local:9092
      consumerGroup: tsoc-stream-processor
      topic: raw_traffic
      lagThreshold: "1000"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsoc-api-hpa
  namespace: tsoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsoc-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-sink-hpa
  namespace: tsoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsoc-kafka-sink
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
