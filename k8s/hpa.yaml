apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: stream-processor-scaler
  namespace: tsoc
spec:
  scaleTargetRef:
    # KEDA defaults an omitted kind to Deployment; tsoc-stream-processor is
    # a StatefulSet (k8s/soc-deployment.yaml), so this ScaledObject was
    # silently entering ScaleTargetNotFound and never actually scaling on
    # Kafka lag -- a hard throughput ceiling in a threat-detection pipeline.
    apiVersion: apps/v1
    kind: StatefulSet
    name: tsoc-stream-processor
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: soc-redpanda-cluster.prod.svc.cluster.local:9092
      consumerGroup: tsoc-stream-processor
      topic: raw_traffic
      lagThreshold: "1000"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsoc-api-hpa
  namespace: tsoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsoc-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  # CPU-only scaling means a memory leak or large-batch spike drives a pod
  # to its 512Mi limit (soc-deployment.yaml) and OOMKill without ever
  # triggering scale-out. 80% leaves headroom before the kill.
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-sink-hpa
  namespace: tsoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsoc-kafka-sink
  # NOTE: this Deployment mounts a single, fixed-name ReadWriteOnce PVC
  # (kafka-sink-dlq-pvc, k8s/dlq-pvc.yaml) rather than per-replica
  # volumeClaimTemplates -- a second replica cannot attach that volume on
  # a different node and gets stuck Pending/FailedAttachVolume. minReplicas
  # is 1 to match what this architecture can actually schedule; true
  # horizontal scaling needs either an RWX storage class or converting
  # this Deployment to a StatefulSet (mirroring tsoc-stream-processor's
  # pattern) with its own volumeClaimTemplates.
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
