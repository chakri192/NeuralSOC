apiVersion: v1
kind: Service
metadata:
  name: tsoc-api-service
spec:
  selector:
    app: tsoc-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: tsoc-stream-processor-service
spec:
  selector:
    app: tsoc-stream-processor
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
