apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tsoc
spec:
  podSelector: {}
  ingress: []
  egress: []
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-api
  policyTypes: [Ingress, Egress]
  # Identity-enforced via Cilium/Calico: serviceAccount tsoc-api-sa required for ingress
  # Note: Standard NetworkPolicy lacks SA selectors; enforce via CiliumClusterwideNetworkPolicy
  # or admission controller (OPA/Gatekeeper) to prevent label-spoof identity bypass.
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow Prometheus scraping for metrics collection
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redis
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: db-namespace
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stream-processor-policy
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-stream-processor
  policyTypes: [Ingress, Egress]
  ingress:
  # Allow health checks and metrics scraping on port 6066 from Prometheus monitoring namespace or self
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tsoc
      podSelector:
        matchLabels:
          app: tsoc-stream-processor
    ports:
    - protocol: TCP
      port: 6066
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redis
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod
      podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
  # Strictly restricted egress: allow outbound HTTPS to verified Cloudflare Anycast CIDRs for ipapi.co threat intel
  - to:
    - ipBlock:
        cidr: 104.16.0.0/12  # Cloudflare Anycast IP range (includes 104.21.x.x, 104.26.x.x)
    - ipBlock:
        cidr: 172.64.0.0/13  # Cloudflare Anycast IP range (includes 172.67.x.x)
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-sink-policy
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-kafka-sink
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod
      podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: db-namespace
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
