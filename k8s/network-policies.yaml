apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tsoc
spec:
  podSelector: {}
  ingress: []
  egress: []
  policyTypes: [Ingress, Egress]
# NOTE: a "deny-link-local" NetworkPolicy previously lived here. Kubernetes
# NetworkPolicy has no deny primitive -- every `egress` entry is an ALLOW
# rule, and policies for the same pods union together. A policy named
# "deny" whose podSelector is {} (every pod in the namespace) and whose
# egress list is [169.254.0.0/16, 127.0.0.0/8] therefore GRANTED every pod
# unrestricted egress to the cloud instance-metadata range, overriding
# default-deny-all above and opening a path to steal node IAM credentials
# via any SSRF.
#
# The same union behavior applies ACROSS policy kinds, not just within
# this file: k8s/cilium-identity-policy.yaml defines a CiliumNetworkPolicy
# for each of these same three pod selectors, and Cilium enforces the
# union of every applicable policy (plain NetworkPolicy or Cilium CRD) for
# a given endpoint -- traffic allowed by EITHER is allowed. Verified
# directly against a real kind+Cilium cluster: with the broad ipBlock
# rules this file used to carry, a tsoc-stream-processor pod could reach
# an arbitrary public IP on :443, not just the FQDN-pinned threat-intel
# API Cilium's policy allows -- the plain NetworkPolicy's wider CIDR rule
# was silently overriding the tighter Cilium one. Kubelet-probe ingress
# and the internet-egress rule are therefore defined ONLY in
# cilium-identity-policy.yaml now (fromEntities: [host, remote-node] and
# toFQDNs respectively) -- both strictly tighter than a CIDR block, and
# the only place they can safely live given this union behavior. What
# remains in this file (default-deny-all, and the narrow
# namespace+pod-selector rules for redis/postgres/kube-dns/ingress-nginx/
# prometheus below) doesn't have this problem: those are exact-identity
# matches, not broad CIDRs, so their union with the equivalent Cilium
# rules doesn't widen anything beyond what's already intended.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-api
  policyTypes: [Ingress, Egress]
  # Identity-enforced via Cilium/Calico: serviceAccount tsoc-api-sa required for ingress
  # Note: Standard NetworkPolicy lacks SA selectors; enforce via CiliumClusterwideNetworkPolicy
  # or admission controller (OPA/Gatekeeper) to prevent label-spoof identity bypass.
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow Prometheus scraping for metrics collection
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
  # The dashboard and kafka-sink both call this API from inside the same
  # namespace now (the dashboard for every read/login/triage call;
  # kafka-sink for POST /api/v1/ingest/alerts, since it stopped writing
  # to Postgres directly) -- this completes the "allow ingress to api
  # pods only from dashboard and ingress controllers" intent that used
  # to be a dangling, unimplemented comment at the bottom of this file
  # with no dashboard workload to actually apply it to yet.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tsoc
      podSelector:
        matchLabels:
          app: tsoc-dashboard
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tsoc
      podSelector:
        matchLabels:
          app: tsoc-kafka-sink
    ports:
    - protocol: TCP
      port: 8000
  # Kubelet liveness/readiness probe ingress is defined only in
  # cilium-identity-policy.yaml's tsoc-api-policy (fromEntities:
  # [host, remote-node]) -- see the note on default-deny-all above for why
  # a CIDR-based version of this same rule doesn't belong here too.
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redis
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: db-namespace
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stream-processor-policy
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-stream-processor
  policyTypes: [Ingress, Egress]
  ingress:
  # Allow health checks and metrics scraping on port 6066 from Prometheus monitoring namespace or self
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tsoc
      podSelector:
        matchLabels:
          app: tsoc-stream-processor
    ports:
    - protocol: TCP
      port: 6066
  # Kubelet liveness/readiness probe ingress is defined only in
  # cilium-identity-policy.yaml's tsoc-stream-processor-policy
  # (fromEntities: [host, remote-node]) -- see the note on
  # default-deny-all above for why a CIDR-based version of this same rule
  # doesn't belong here too.
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redis
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod
      podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
  # Threat-intel API egress is defined only in
  # cilium-identity-policy.yaml's tsoc-stream-processor-policy
  # (toFQDNs: ipwho.is) -- see the note on default-deny-all above. This
  # used to be a "0.0.0.0/0 except private ranges" ipBlock here, which is
  # not just redundant with the FQDN rule but strictly wider than it:
  # confirmed against a real cluster that it let this pod reach arbitrary
  # public IPs on :443, not just the one threat-intel API it's meant to
  # call.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-sink-policy
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-kafka-sink
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prod
      podSelector:
        matchLabels:
          app: redpanda
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: db-namespace
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # kafka-sink stopped writing to Postgres directly once it moved to
  # calling POST /api/v1/ingest/alerts over HTTP instead (see
  # api/kafka_sink.py's _ingest_via_api) -- the postgres egress rule
  # above is now unused by this pod but left in place since Alembic
  # migrations and any future direct-DB tooling may still run from here;
  # this rule is the one kafka-sink actually depends on today.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tsoc
      podSelector:
        matchLabels:
          app: tsoc-api
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-allow
  namespace: tsoc
spec:
  podSelector:
    matchLabels:
      app: tsoc-dashboard
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8501
  # Kubelet liveness/readiness/startup probe ingress (Streamlit's
  # /_stcore/health) is defined only in cilium-identity-policy.yaml's
  # tsoc-dashboard-policy (fromEntities: [host, remote-node]) -- see the
  # note on default-deny-all above for why a CIDR-based version of this
  # same rule doesn't belong here too.
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tsoc
      podSelector:
        matchLabels:
          app: tsoc-api
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
