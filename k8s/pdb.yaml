apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-stream-processor
  namespace: tsoc
spec:
  maxUnavailable: 1  # allowed but requires minAvailable: 2 guard
  selector:
    matchLabels:
      app: tsoc-stream-processor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-api
  namespace: tsoc
spec:
  maxUnavailable: 1  # allowed but requires minAvailable: 2 guard
  selector:
    matchLabels:
      app: tsoc-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-kafka-sink
  namespace: tsoc
spec:
  maxUnavailable: 1  # allowed but requires minAvailable: 2 guard
  selector:
    matchLabels:
      app: tsoc-kafka-sink
