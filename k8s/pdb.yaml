apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-stream-processor
  namespace: default
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: tsoc-stream-processor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-api
  namespace: default
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: tsoc-api
