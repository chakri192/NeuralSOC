apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-stream-processor
  namespace: tsoc
spec:
  maxUnavailable: 1  # allowed but requires minAvailable: 2 guard
  selector:
    matchLabels:
      app: tsoc-stream-processor
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-api
  namespace: tsoc
spec:
  maxUnavailable: 1  # allowed but requires minAvailable: 2 guard
  selector:
    matchLabels:
      app: tsoc-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-kafka-sink
  namespace: tsoc
spec:
  # At the current replicas: 1 (see hpa.yaml's note on why this Deployment
  # can't yet run >1 replica), maxUnavailable: 1 permits the sole pod to
  # be evicted during a voluntary disruption (e.g. node drain) -- this PDB
  # provides no actual protection until the replica-count constraint above
  # is resolved. Left permissive rather than maxUnavailable: 0, which would
  # block node drains entirely for a singleton pod.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: tsoc-kafka-sink
