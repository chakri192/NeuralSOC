# Note: With tsoc-stream-processor migrated to a Kubernetes StatefulSet,
# dedicated ReadWriteOnce (RWO) PVCs are dynamically provisioned per replica
# via volumeClaimTemplates (dlq-data-tsoc-stream-processor-0, 1, 2).
# This manifest serves as a template or fallback for standalone/singleton deployments.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stream-processor-dlq-pvc
  namespace: tsoc
spec:
  accessModes:
    - ReadWriteOnce   # Isolated RWO volume preventing cross-pod data leakage or tampering
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
