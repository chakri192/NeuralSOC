apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tsoc-api-monitor
  namespace: tsoc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: tsoc-api
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    # /metrics requires authentication (api/main.py wraps it in
    # Depends(verify_auth) -- it was previously unauthenticated and
    # unrated-limited, leaking route inventory and traffic volume to
    # anyone who could reach it). Prometheus needs the same service key
    # every other authenticated caller uses to actually scrape it.
    bearerTokenSecret:
      name: tsoc-secrets
      key: api_key
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tsoc-stream-processor-monitor
  namespace: tsoc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: tsoc-stream-processor
  endpoints:
  # Same headless Service (k8s/soc-deployment.yaml) already used for
  # /healthz -- /metrics is unauthenticated (unlike the API's), since this
  # Service has no ingress route at all and is only reachable in-cluster,
  # already gated by k8s/cilium-identity-policy.yaml to the monitoring
  # namespace's prometheus pods specifically.
  - port: metrics
    path: /metrics
    interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tsoc-kafka-sink-monitor
  namespace: tsoc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: tsoc-kafka-sink
  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s
