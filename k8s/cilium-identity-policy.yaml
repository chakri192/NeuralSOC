apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tsoc-stream-processor-policy
  namespace: tsoc
spec:
  endpointSelector:
    matchLabels:
      app: tsoc-stream-processor
      k8s:io.kubernetes.pod.namespace: tsoc
  ingress:
    # Health checks and metrics scraping
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
      toPorts:
        - ports:
            - port: "6066"
              protocol: TCP
    # Allow Kubelet health/readiness probes from host and remote nodes
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6066"
              protocol: TCP
  egress:
    # CoreDNS / kube-dns (required for Kafka broker FQDN resolution + service discovery)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Redis correlation state (atomic Lua scripts + windowed correlation)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: redis
            app: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Redpanda / Kafka broker clusters (durable offset commits + DLQ)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prod
            app: redpanda
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    # FQDN-based Threat Intelligence API (ipwho.is) via TLS with endpoint
    # identity. A "toCIDR: [169.254.169.254/32, 169.254.0.0/16]" fragment
    # previously sat here with no toPorts restriction -- invalid YAML as
    # written (this file failed to parse), and had it parsed, an
    # unrestricted allow-list straight to the cloud instance-metadata
    # service. The only egress this rule needs is the FQDN allow below.
    # ipapi.co (the original provider) exhausted its free-tier rate limit
    # within seconds under real traffic; ipwho.is is also free/no-API-key
    # but with materially higher limits -- see inference/enrichment.py.
    - toFQDNs:
        - matchName: "ipwho.is"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tsoc-api-policy
  namespace: tsoc
spec:
  endpointSelector:
    matchLabels:
      app: tsoc-api
      k8s:io.kubernetes.pod.namespace: tsoc
  ingress:
    # Ingress NGINX with namespace and pod identity verification
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress-nginx
            app.kubernetes.io/name: ingress-nginx
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Prometheus metrics scraper
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Allow Kubelet health/readiness probes from host and remote nodes
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # tsoc-dashboard (every read/login/triage call) and tsoc-kafka-sink
    # (POST /api/v1/ingest/alerts, since it stopped writing to Postgres
    # directly) both call this API from inside the same namespace now --
    # mirrors network-policies.yaml's api-allow ingress rule of the same
    # name/intent.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tsoc
            app: tsoc-dashboard
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tsoc
            app: tsoc-kafka-sink
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Redis rate-limiting backend
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: redis
            app: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # PostgreSQL primary database
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db-namespace
            app: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tsoc-kafka-sink-policy
  namespace: tsoc
spec:
  endpointSelector:
    matchLabels:
      app: tsoc-kafka-sink
      k8s:io.kubernetes.pod.namespace: tsoc
  ingress:
    # Prometheus metrics scraping (k8s/soc-deployment.yaml's kafka-sink
    # container now runs a prometheus_client HTTP server on 9101 -- this
    # was ingress: [] before that existed, correctly, since kafka-sink is
    # otherwise a pure Kafka consumer with no inbound HTTP surface at all).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app: prometheus
      toPorts:
        - ports:
            - port: "9101"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Redpanda / Kafka broker cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prod
            app: redpanda
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    # PostgreSQL storage sink -- unused by kafka-sink itself since it
    # moved to calling the ingest API over HTTP (see api/kafka_sink.py's
    # _ingest_via_api), left in place for the same reason noted in
    # network-policies.yaml's kafka-sink-policy.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: db-namespace
            app: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # tsoc-api, for POST /api/v1/ingest/alerts -- the rule kafka-sink
    # actually depends on today.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tsoc
            app: tsoc-api
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tsoc-dashboard-policy
  namespace: tsoc
spec:
  endpointSelector:
    matchLabels:
      app: tsoc-dashboard
      k8s:io.kubernetes.pod.namespace: tsoc
  ingress:
    # Ingress NGINX with namespace and pod identity verification
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress-nginx
            app.kubernetes.io/name: ingress-nginx
      toPorts:
        - ports:
            - port: "8501"
              protocol: TCP
    # Allow Kubelet health/readiness/startup probes (Streamlit's
    # /_stcore/health) from host and remote nodes
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8501"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # tsoc-api, for every read/login/triage call the dashboard makes
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tsoc
            app: tsoc-api
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
