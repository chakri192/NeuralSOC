apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tsoc-stream-processor
  name: tsoc-stream-processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tsoc-stream-processor
  template:
    metadata:
      labels:
        app: tsoc-stream-processor
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 50Mi
      - name: dlq
        emptyDir:
          sizeLimit: 50Mi
      - name: cache
        emptyDir:
          sizeLimit: 50Mi
      containers:
      - env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: slack_webhook_url
        - name: PAGERDUTY_ROUTING_KEY
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: pagerduty_routing_key
        - name: REDPANDA_BROKERS
          value: soc-redpanda-cluster.prod.svc.cluster.local:9092
        - name: REDIS_HOST
          value: redis.redis.svc.cluster.local
        image: your-registry.com/tsoc/stream-processor:v1.0
        name: faust-worker
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: dlq
          mountPath: /tmp/dlq
        - name: cache
          mountPath: /var/lib/app
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: 6066
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6066
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6066
          initialDelaySeconds: 15
          periodSeconds: 10

        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsoc-api
  namespace: tsoc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tsoc-api
  template:
    metadata:
      labels:
        app: tsoc-api
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 50Mi
      - name: dlq
        emptyDir:
          sizeLimit: 50Mi
      - name: cache
        emptyDir:
          sizeLimit: 50Mi
      containers:
      - env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: slack_webhook_url
        - name: PAGERDUTY_ROUTING_KEY
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: pagerduty_routing_key
        - name: TSOC_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: tsoc-secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: DATABASE_URL
        image: your-registry.com/tsoc/api:v1.0
        name: fastapi
        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: dlq
          mountPath: /tmp/dlq
        - name: cache
          mountPath: /var/lib/app
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
