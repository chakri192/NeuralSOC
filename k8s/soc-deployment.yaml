apiVersion: v1
kind: Namespace
metadata:
  name: tsoc
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsoc-api-sa
  annotations:
    spiffe.io/spiffe-id: "spiffe://tsoc.local/ns/tsoc/sa/tsoc-api-sa"
    cilium.io/identity-based-policy: "enabled"
  namespace: tsoc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsoc-stream-sa
  namespace: tsoc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsoc-sink-sa
  namespace: tsoc
---
apiVersion: v1
kind: Service
metadata:
  name: tsoc-stream-processor
  namespace: tsoc
  labels:
    app: tsoc-stream-processor
spec:
  clusterIP: None
  selector:
    app: tsoc-stream-processor
  ports:
  - port: 6066
    name: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: tsoc-stream-processor
  name: tsoc-stream-processor
  namespace: tsoc
spec:
  serviceName: "tsoc-stream-processor"
  replicas: 3
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: tsoc-stream-processor
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: tsoc-stream-processor
  template:
    metadata:
      labels:
        app: tsoc-stream-processor
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      - name: cache
        emptyDir:
          sizeLimit: 500Mi
      containers:
      - env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: slack_webhook_url
        - name: PAGERDUTY_ROUTING_KEY
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: pagerduty_routing_key
        - name: REDPANDA_BROKERS
          value: soc-redpanda-cluster.prod.svc.cluster.local:9092
        - name: REDIS_HOST
          value: redis.redis.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: redis_password
              optional: true
        imagePullPolicy: IfNotPresent
        image: your-registry.com/tsoc/stream-processor:v1.0
        name: faust-worker
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: dlq-data
          mountPath: /tmp/dlq
        - name: cache
          mountPath: /var/lib/app
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: 6066
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6066
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6066
          initialDelaySeconds: 15
          periodSeconds: 10

        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: tsoc-stream-sa
  volumeClaimTemplates:
  - metadata:
      name: dlq-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsoc-api
  annotations:
    spiffe.io/spiffe-id: "spiffe://tsoc.local/ns/tsoc/sa/tsoc-api"
    cilium.io/identity-based-policy: "enabled"
  namespace: tsoc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tsoc-api
  template:
    metadata:
      labels:
        app: tsoc-api
    spec:
      terminationGracePeriodSeconds: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      - name: dlq
        emptyDir:
          sizeLimit: 1Gi
      - name: cache
        emptyDir:
          sizeLimit: 500Mi
      containers:
      - env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: slack_webhook_url
        - name: PAGERDUTY_ROUTING_KEY
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: pagerduty_routing_key
        - name: TSOC_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: tsoc-secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: DATABASE_URL
        - name: TRUSTED_PROXY_CIDRS
          value: "127.0.0.1/32,::1/128,10.244.0.0/16"
        - name: REDIS_HOST
          value: redis.redis.svc.cluster.local
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: redis_password
              optional: true
        image: your-registry.com/tsoc/api:v1.0
        imagePullPolicy: Always
        name: fastapi
        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: dlq
          mountPath: /tmp/dlq
        - name: cache
          mountPath: /var/lib/app
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /livez
            port: 8000
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: tsoc-api-sa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsoc-kafka-sink
  namespace: tsoc
  labels:
    app: tsoc-kafka-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsoc-kafka-sink
  template:
    metadata:
      labels:
        app: tsoc-kafka-sink
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      - name: dlq
        persistentVolumeClaim:
          claimName: kafka-sink-dlq-pvc
      containers:
      - name: kafka-sink
        image: your-registry.com/tsoc/api:v1.0
        imagePullPolicy: Always
        command: ["python", "-m", "api.kafka_sink"]
        env:
        - name: REDPANDA_BROKERS
          value: soc-redpanda-cluster.prod.svc.cluster.local:9092
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: DATABASE_URL
        - name: ALERTS_TOPIC
          value: security_alerts
        - name: ALERTS_DLQ_TOPIC
          value: security_alerts_dlq
        - name: DLQ_FILE_PATH
          value: /tmp/dlq/alerts.jsonl
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: dlq
          mountPath: /tmp/dlq
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command: ["python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/tmp') else 1)"]
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/tmp') else 1)"]
          initialDelaySeconds: 30
          failureThreshold: 3
          periodSeconds: 20
        readinessProbe:
          exec:
            command: ["python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/tmp') else 1)"]
          initialDelaySeconds: 15
          failureThreshold: 3
          periodSeconds: 10
      serviceAccountName: tsoc-sink-sa