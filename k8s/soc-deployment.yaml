apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: tsoc-stream-processor
  name: tsoc-stream-processor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tsoc-stream-processor
  template:
    metadata:
      labels:
        app: tsoc-stream-processor
    spec:
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      containers:
      - env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: slack_webhook_url
        - name: PAGERDUTY_ROUTING_KEY
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: pagerduty_routing_key
        - name: REDPANDA_BROKERS
          value: soc-redpanda-cluster.prod.svc.cluster.local:9092
        image: your-registry.com/tsoc/stream-processor:v1.0
        name: faust-worker
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/lib/app
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:6066/agent/health
          failureThreshold: 3
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:6066/agent/health
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          exec:
            command:
            - curl
            - -f
            - http://localhost:6066/agent/health
          initialDelaySeconds: 15
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsoc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tsoc-api
  template:
    metadata:
      labels:
        app: tsoc-api
    spec:
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      containers:
      - env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: slack_webhook_url
        - name: PAGERDUTY_ROUTING_KEY
          valueFrom:
            secretKeyRef:
              name: tsoc-secrets
              key: pagerduty_routing_key
        - name: TSOC_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: tsoc-secrets
        image: your-registry.com/tsoc/api:v1.0
        name: fastapi
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/lib/app
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
