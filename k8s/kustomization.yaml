# Base Kustomization: every manifest as-is. This is the entry point for
# applying the manifests below with no per-environment overlay
# (`kubectl apply -k k8s/`).
#
# k8s-overlays/{staging,production}/kustomization.yaml reference this
# directory directly (`resources: [../../k8s]`) -- deliberately placed
# outside k8s/ rather than at k8s/overlays/, since kustomize v5's cycle
# detection rejects an overlay nested inside the same directory tree as
# the base it points at ("candidate root ... contains visited root"),
# even though there's no actual circular resource reference here (this
# file's `resources:` below never reaches back into any overlay). See
# k8s-overlays/staging/kustomization.yaml's own comment for the full
# explanation.
#
# k8s/secrets.yaml.example is deliberately NOT listed here -- secrets
# provisioning (Sealed Secrets / Vault, see that file's own comments)
# is a separate concern from templating these resources, the same way
# it already was before Kustomize existed: an operator applies a real,
# populated k8s/secrets.yaml (gitignored) on its own, before applying
# whichever overlay below.
resources:
  - soc-deployment.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - dlq-pvc.yaml
  - network-policies.yaml
  - cilium-identity-policy.yaml
  - opa-gatekeeper-policies.yaml
  - kyverno-verify.yaml
  - cert-manager-internal-ca.yaml
  - cert-manager-public-ca.yaml
  - prometheus.yaml
  - prometheus-rules.yaml
  - spiffe-identity.yaml
