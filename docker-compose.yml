version: "3.7"
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: soc-redpanda
    platform: linux/arm64
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://soc-redpanda:29092,external://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
      - --set redpanda.enable_transactions=true
      - --set redpanda.enable_idempotence=true
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "9092:9092"
      - "29092:29092"
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  postgres:
    image: postgres:15-alpine
    container_name: soc-postgres
    platform: linux/arm64
    environment:
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: secure_soc_password
      POSTGRES_DB: tsoc
    ports:
      - "5432:5432"
    
  redis:
    image: redis:7-alpine
    container_name: soc-redis
    platform: linux/arm64
    ports:
      - "6379:6379"
    networks:
      - soc-net

volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_admin -d tsoc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soc-net

volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - soc-net

volumes:
  redpanda-data:
    driver: local
  postgres-data:
    driver: local

networks:
  soc-net:
    driver: bridge
