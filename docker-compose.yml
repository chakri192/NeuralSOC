version: "3.7"

# No `platform:` pins: redpanda, postgres:15-alpine, and redis:7-alpine are
# all published as real multi-arch manifests (amd64 + arm64). Pinning
# linux/arm64 unconditionally forced QEMU emulation on the amd64 CI runner
# this file is now also used from -- Docker already selects the correct
# native image for whatever host runs `docker compose up` without a pin.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: soc-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://soc-redpanda:29092,external://localhost:9092
      - --set redpanda.enable_transactions=true
      - --set redpanda.enable_idempotence=true
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      # advertise-kafka-addr above already tells external clients to reach
      # this at "localhost:9092" specifically -- binding the published
      # port to loopback only matches that intent and closes the LAN
      # exposure a bare "9092:9092" leaves open on all host interfaces.
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - soc-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # read_only: true was tried here and reverted -- redpanda writes its own
    # generated config to /etc/redpanda at runtime (not just its data dir),
    # confirmed directly: "error writing to temporary file: ... read-only
    # file system"; adding a tmpfs for that path just traded it for
    # "... permission denied" instead, meaning its actual writable-path
    # requirements go beyond one directory in a way that needs more
    # characterization than a config change should be guessing at.
    # no-new-privileges is unrelated to writability and safe regardless.
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:15-alpine
    container_name: soc-postgres
    environment:
      POSTGRES_USER: ${COMPOSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD}
      POSTGRES_DB: tsoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - soc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSE_POSTGRES_USER} -d tsoc"]
      interval: 5s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: soc-redis
    # ${REDIS_PASSWORD:?...} (not :-) so Compose hard-fails on an unset
    # var instead of silently starting redis-server with auth disabled --
    # the previous ${REDIS_PASSWORD:-} default was the difference between
    # a loud misconfiguration and a silent one.
    # --tls-auth-clients no: redis-server defaults to REQUIRING a client
    # certificate the moment --tls-ca-cert-file is set (mutual TLS) --
    # discovered by actually running this compose file end-to-end, where
    # every client (inference/correlation.py, api/deps.py) was refused
    # with "certificate required" despite correctly authenticating via
    # requirepass. Neither client was ever built to present one (there's
    # no client cert generation anywhere in this repo, only the server
    # cert scripts/generate_dev_certs.sh produces) -- as configured, the
    # correlation engine could never connect to Redis at all. Server-side
    # TLS (encryption + server-cert verification via REDIS_CA_CERT_PATH)
    # plus requirepass is the auth model this codebase actually
    # implements; mTLS was never wired up to be usable.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--tls-port", "6379", "--port", "0", "--tls-cert-file", "/certs/redis.crt", "--tls-key-file", "/certs/redis.key", "--tls-ca-cert-file", "/certs/ca.crt", "--tls-auth-clients", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # The command above requires these three files to exist under
      # ./certs on the host (self-signed is fine for local dev; see
      # scripts/create_topics.sh's neighbors for how the broker side is
      # provisioned). Without this mount the container fails to start,
      # which is preferable to silently falling back to plaintext.
      - ./certs:/certs:ro
    networks:
      - soc-net
    # redpanda and postgres above both have a real healthcheck; this
    # service never did. A caller (CI, or a human) that only waits on
    # redpanda's health before starting the app can race redis's own
    # startup -- confirmed directly: CI's integration-smoke-test job hit
    # exactly this, "Connection refused" on 6379, because nothing here
    # ever signaled "ready" for anything to wait on. REDIS_PASSWORD needs
    # to be a real env var in the container (not just substituted into
    # `command` above at compose-parse time) for the healthcheck's own
    # shell to read it back.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 --tls --cacert /certs/ca.crt -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  redpanda-data:
    driver: local
  postgres-data:
    driver: local

networks:
  soc-net:
    driver: bridge
# Verify postgres connection uses sslmode=require; document at-rest encryption
