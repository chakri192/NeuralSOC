version: "3.7"

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: soc-redpanda
    platform: linux/arm64
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://soc-redpanda:29092,external://localhost:9092
      - --set redpanda.enable_transactions=true
      - --set redpanda.enable_idempotence=true
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - soc-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: soc-postgres
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${COMPOSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD}
      POSTGRES_DB: tsoc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - soc-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSE_POSTGRES_USER} -d tsoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soc-redis
    platform: linux/arm64
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--tls-port", "6379", "--port", "0", "--tls-cert-file", "/certs/redis.crt", "--tls-key-file", "/certs/redis.key", "--tls-ca-cert-file", "/certs/ca.crt"]
    ports:
      - "6379:6379"
    networks:
      - soc-net

volumes:
  redpanda-data:
    driver: local
  postgres-data:
    driver: local

networks:
  soc-net:
    driver: bridge
