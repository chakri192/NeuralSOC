version: 2
updates:
  # Turns the manual pip-audit sweep that fixed torch/PyJWT/scapy/pyarrow/
  # streamlit/faust-streaming/click/idna into a standing process instead of
  # a one-time snapshot -- without this, the next CVE disclosed against any
  # of these silently reopens the gap that sweep just closed.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keeps pinned Action versions (e.g. aquasecurity/trivy-action@v0.24.0)
  # current -- an Action itself can carry a vulnerability, same as a
  # Python dependency.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Dockerfile's base image is digest-pinned (python:3.12-slim-bookworm@
  # sha256:...), which is correct for build reproducibility, but it also
  # means nothing bumps that digest on its own -- OS package CVEs (glibc,
  # OpenSSL, the kernel userland) accumulate silently in the base layer
  # until someone manually re-resolves it. This scans the Dockerfile and
  # opens a PR with the new digest when the base image is rebuilt upstream.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
