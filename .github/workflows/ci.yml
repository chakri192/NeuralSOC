name: TSOC Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-code-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write  # required for cosign keyless signing (Fulcio/Rekor via this run's OIDC token)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint -- genuine bugs (fail on error)
        # E9 syntax errors, F63 invalid comparisons, F7 break/continue/
        # return misuse, F82 undefined names -- the classes of bug this
        # remediation found repeatedly shipping through CI unnoticed
        # (three separate SyntaxErrors, a missing `import time`, a missing
        # logger assignment). Style-only findings are reported separately
        # below without blocking the build.
        run: flake8 . --exclude=.git,__pycache__,venv,tests/fixtures,inference/__pycache__,.pytest_cache --select=E9,F63,F7,F82 --show-source

      - name: Lint -- full style report (advisory, non-blocking)
        run: flake8 . --exclude=.git,__pycache__,venv,tests/fixtures,inference/__pycache__,.pytest_cache --max-line-length=120 --count --statistics --exit-zero

      - name: Bandit security scan (high severity = fail)
        run: bandit -r api inference ingest shared scripts -lll -ii -f json -o bandit-report.json

      - name: Bandit -- full severity report (advisory, non-blocking)
        # The step above only reports HIGH severity + medium/high
        # confidence (-lll -ii) as a hard gate, matching its own name --
        # but that also meant medium/low severity findings (weak hashes,
        # missing TLS verification, etc.) were invisible everywhere, not
        # just non-blocking. Mirrors the flake8 lint above: one strict
        # gate, one advisory report with everything else.
        run: bandit -r api inference ingest shared scripts -ll -f json -o bandit-report-full.json --exit-zero

      - name: Unit tests + coverage (fail if any error, or coverage regresses)
        # Real coverage is now 72% locally (132 tests) after also driving
        # api/kafka_sink.py's run_sink() consumer loop and
        # stream_processor_faust.py's process_traffic() agent directly
        # (fake KafkaConsumer + a real SIGINT for the former, Faust's
        # Agent.fun to reach the undecorated function for the latter) --
        # both previously only exercised end-to-end via test_load.py, with
        # no unit-level coverage of their own branches. Raised from 65 to
        # 80 after closing the five thinnest modules (ingest/simulator.py,
        # shared/data_access.py, inference/correlation.py -- which also
        # surfaced a real bug: history alerts returned as bytes rather
        # than str from a Lua EVAL snapshot were silently dropped from
        # incident aggregation -- inference/train_model.py,
        # ingest/pcap_ingester.py) took real coverage from 73% to 84%; 80
        # leaves the same kind of margin for the real Python-3.12 CI
        # runner while still catching a real regression, not rubber-stamping.
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short --durations=10 \
            --cov=api --cov=inference --cov=shared --cov=ingest \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Model integrity verification (real digest check)
        run: |
          echo "Verifying model hashes against tracked .sha256..."
          for f in models/*.pt; do
            base=$(basename "$f" .pt)
            if [ ! -f "models/${base}.pt.sha256" ]; then
              echo "FAIL: $f has no tracked .sha256 -- cannot verify, refusing to silently skip"; exit 1
            fi
            expected=$(cat "models/${base}.pt.sha256" | awk '{print $1}')
            actual=$(sha256sum "$f" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "FAIL: $f hash mismatch (expected $expected got $actual)"; exit 1
            fi
            echo "PASS: $f verified"
          done

      - name: DGA model real-world regression gate
        # Hash verification above only proves the shipped model wasn't
        # corrupted or swapped -- it says nothing about whether it's any
        # good. This runs the exact same real-world benchmark used to
        # validate every retrain by hand this far (SECURITY.md's "Model
        # validation against real-world data" section) and fails the
        # build if any of the 25 real malware families' recall drops more
        # than 10 points against benchmarks/dga_family_recall_baseline.json
        # -- the same check that, run manually, caught a real
        # vawtrak/conficker/pushdo regression from a training-mix change
        # before it shipped. `--update-baseline` is deliberately never
        # passed here: accepting a real, intentional trade-off from a
        # retrain is a human decision (see scripts/evaluate_against_real_dga_dataset.py's
        # own --help), not something CI should silently wave through.
        run: PYTHONPATH=. python3 scripts/evaluate_against_real_dga_dataset.py

      - name: DGA model second, independent dataset regression gate
        # Answers docs/PATH_TO_10_OUT_OF_10.md's Phase 10 question: does
        # the gate above's 84.6%/77.2%/13.9% actually generalize, or is it
        # an artifact of that one benchmark's specific domain generation?
        # benchmarks/real_dga_domains_umudga.csv is built from UMUDGA (MIT
        # licensed, malware DGA implementations actually executed, not
        # wire-observed like the first dataset) for the malicious side and
        # Tranco (not Alexa) for the benign side -- both independent of
        # the first gate's sourcing. Measured live: 86.3%/75.8%/12.0%,
        # remarkably close to the first dataset's numbers -- real evidence
        # the CNN's performance isn't an artifact of one benchmark. This
        # gate protects that finding the same way: fails if any of the 51
        # anonymized-but-traceable malware groups' recall drops more than
        # 10 points against benchmarks/dga_second_dataset_baseline.json.
        run: PYTHONPATH=. python3 scripts/evaluate_against_second_dga_dataset.py

      - name: Flow autoencoder real-world regression gate
        # Same idea as the DGA gate above, for the other validated DL
        # detector. The autoencoder was synthetic-only until this session
        # found it measured a ~98% false-positive rate against real
        # CTU-13 traffic (SECURITY.md's "Flow autoencoder validation
        # against real-world data" section) -- retrained on real data,
        # it now measures 100% precision / 99.8% recall / 0.00% FPR
        # against a real held-out scenario. This is what stops a future
        # retrain from silently sliding back toward that ~98% number
        # without anyone noticing until a real deployment does.
        #
        # This gate now ALSO checks a second, independent baseline
        # (benchmarks/flow_autoencoder_all_scenarios_baseline.json): the
        # 99.8% figure above is against one held-out scenario whose own
        # neighbors trained the model; run against real traffic from all
        # 13 real CTU-13 scenarios instead, the model originally caught
        # only ~37% of real botnet flows. Without this second gate, a
        # future retrain could keep acing the narrow scenario-11 holdout
        # while silently regressing broad generalization and nothing
        # would catch it -- both baselines must hold for this step to
        # pass.
        #
        # Later broadened training itself from 3 real scenarios (5/7/12)
        # to 12 (everything but scenario 11), closing that gap directly:
        # all-13-scenario recall rose 36.9% -> 54.5% (precision 99.3% ->
        # 95.8%, FPR 0.21% -> 0.63%, threshold retuned 0.013 -> 0.0008
        # via a fresh real-data sweep). The all-scenarios gate's OWN FPR
        # measurement had to change too -- most of its dataset is now the
        # same real rows the model trains on, so FPR there is measured
        # only against real Normal rows the model never saw
        # (benchmarks/real_flow_dataset_normal_holdout.csv + scenario
        # 11) instead of the full all-13-scenario file. See
        # SECURITY.md's "Broadened retrain" section for the full writeup.
        run: PYTHONPATH=. python3 scripts/evaluate_flow_autoencoder_against_real_data.py

      - name: Rule-based detector real-world regression gate
        # 4 of evaluate_rules()'s 6 rules had never been run against real
        # attack data until this session (SECURITY.md's "Rule-based
        # detector validation against real-world data" section) --
        # Reconnaissance genuinely works on real CTU-13 traffic (99.8%
        # precision / 48.5% recall); these single-FLOW versions of DDoS
        # and C2 Beaconing barely fire at all (0.2-0.5% recall each) --
        # exhaustive real threshold sweeps found this is structural, not
        # a tuning gap (a real flood/beacon is a MULTI-connection pattern
        # a single flow's own fields can't encode), which is what the
        # windowed detectors in the next step actually fix. This gate
        # doesn't claim these single-flow versions are good; it only
        # protects today's real baseline from getting silently worse.
        run: PYTHONPATH=. python3 scripts/evaluate_rules_against_real_data.py

      - name: Connection-behavior detector real-world regression gate
        # inference/conn_behavior.py's ConnBehaviorTracker is the fix for
        # the structural gap the step above discloses: a real volumetric
        # flood, periodic C2 beacon, or bulk exfil transfer is a pattern
        # across MANY connections over time, not any single connection's
        # byte/packet count. Calibrated against the raw CTU-13 .binetflow
        # files (real SrcAddr/DstAddr/StartTime, not
        # benchmarks/real_rule_validation_dataset.csv's already-sampled
        # extract) and measured against the exact same production
        # tracker class in real chronological order per scenario:
        # RULE_DDOS_CONN_RATE reaches 100% precision / 11.3% recall /
        # 0.00% FPR and RULE_EXFIL_BYTE_VOLUME reaches ~100% precision /
        # 22.2% recall / 0.01% FPR (versus the single-flow rules'
        # 55.3%/0.2%/0.14% and 100%/0.3%/0.00% above -- real, dramatic
        # improvements on every axis, not trade-offs). RULE_C2_BEACON_PERIODIC
        # is real but standalone-weaker (37.0% precision / 0.3% recall /
        # 0.58% FPR -- a fine threshold sweep found its recall is a flat
        # ceiling no threshold moves) -- which is exactly why its
        # confidence is set below 0.5 in
        # inference/stream_processor_faust.py, so a lone firing can never
        # by itself cross calculate_risk_score()'s incident threshold; it
        # corroborates, it doesn't stand alone.
        run: PYTHONPATH=. python3 scripts/evaluate_conn_behavior_against_real_data.py

      - name: Composite incident-scoring real-world regression gate
        # inference/risk.py's calculate_risk_score() combines detectors
        # via log-odds pooling instead of a flat severity-bucket-plus-
        # volume heuristic that ignored confidence_score entirely and
        # let 224 duplicate alerts from one ongoing DNS burst inflate
        # risk 224x (a real behavior observed live this session, not a
        # hypothetical). This also caught that the naive choice of
        # incident threshold (80, inherited from the old, unrelated
        # scoring scale) actually made the composite score WORSE than
        # the best single detector (26.3% recall) until a real threshold
        # sweep found 50 instead.
        #
        # Now combines all SEVEN detectors (folded in the windowed
        # RULE_DDOS_CONN_RATE, RULE_C2_BEACON_PERIODIC, and
        # RULE_EXFIL_BYTE_VOLUME, previously excluded because the rules
        # dataset had no real IP/timestamp fields for them to key a
        # window on -- see benchmarks/real_composite_dataset.csv),
        # replayed against the FULL real Botnet/Normal set from all 13
        # scenarios (not the earlier 2,000-per-scenario capped sample --
        # a windowed check needs each pair's complete, temporally
        # continuous sequence). Measured directly: 98.8% precision /
        # 52.5% recall / 0.80% FPR, a real +7.3-point recall improvement
        # over the best single detector (45.1%, the flow autoencoder) --
        # corroboration still measurably works. The baseline itself moved
        # from the prior measurement (53.7% recall on the smaller,
        # capped dataset) for this reason, not because anything
        # regressed -- see docs/PATH_TO_10_OUT_OF_10.md for the full
        # before/after.
        #
        # Re-measured again after the flow autoencoder's own broadened
        # retrain (3 real training scenarios -> 12): 98.3% precision /
        # 53.0% recall / 1.16% FPR. Composite's lead over the best single
        # detector shrank to +0.4 points (52.6%) because the flow
        # autoencoder alone got meaningfully better, not because
        # corroboration stopped working -- see SECURITY.md's "Composite
        # incident scoring" section for the full before/after.
        run: PYTHONPATH=. python3 scripts/evaluate_composite_scoring_against_real_data.py

      - name: Model provenance (real Sigstore keyless sign + verify)
        # Previously conditional on a COSIGN_PUBLIC_KEY secret that was
        # never configured, so this step only ever printed a warning that
        # provenance was NOT verified. This repo is public, which means
        # cosign's KEYLESS mode is available for free: this runner's own
        # GitHub Actions OIDC token is exchanged for a short-lived signing
        # certificate from the public Fulcio CA, the signature (plus that
        # cert and a Rekor transparency-log entry) is bundled up, and then
        # verified right back in the same job -- no secret to provision,
        # and independently re-checkable by anyone via the same public
        # Rekor log. See SECURITY.md for the exact verify command.
        run: |
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          for f in models/*.pt; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
            cosign verify-blob \
              --bundle "${f}.cosign.bundle" \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/ci\.yml@.*$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
            echo "PASS: $f keylessly signed and verified (Sigstore/Rekor)"
          done

      - name: K8s manifest validation (kubeconform, offline schema check)
        # Fixed at the source in an earlier pass (a "deny" NetworkPolicy
        # that was actually an allow rule to cloud metadata, invalid YAML
        # in the Cilium policy, a duplicate ingress annotations key
        # silently dropping the WAF) but only ever confirmed correct by
        # manual review -- this makes that check repeatable on every future
        # change instead of a one-time read-through. No live cluster
        # needed; -ignore-missing-schemas skips CRDs with no public schema
        # (Cilium CNP, Kyverno ClusterPolicy, ServiceMonitor).
        #
        # Validates `kustomize build` output rather than a flat `k8s/*.yaml`
        # glob -- k8s/kustomization.yaml itself (and k8s/base/, once
        # anything lives there) has no apiVersion/kind and would fail a
        # flat glob's per-file check despite being valid Kustomize config,
        # not a manifest. Building through Kustomize first also means this
        # check validates the exact same rendered output an operator would
        # actually apply, including the staging/production overlays
        # (k8s-overlays/), not just the un-overlaid base.
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin kustomize
          for target in k8s k8s-overlays/staging k8s-overlays/production; do
            echo "== $target =="
            kustomize build "$target" | kubeconform -summary -ignore-missing-schemas
          done

      - name: Build container
        run: docker build -t tsoc:ci .

      - name: Trivy vulnerability scan (container image, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: tsoc:ci
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: tsoc:ci
          format: 'cyclonedx'
          output: 'sbom.cyclonedx.json'

      - name: Load test / burst proof (must pass and not suppress)
        run: PYTHONPATH=. pytest tests/test_load.py -v --tb=short

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            bandit-report-full.json
            coverage.xml
            sbom.cyclonedx.json
            models/*.cosign.bundle

  # Every job above builds a LOCAL, never-published image (`docker build
  # -t tsoc:ci .`) -- nothing anywhere actually pushed one, so
  # k8s/soc-deployment.yaml's image refs were placeholder digests
  # (your-registry.com/tsoc/...) with nothing real behind them. Runs
  # only on a real push to main (not every PR, which would publish an
  # image for code that was never actually merged) and only after
  # security-code-scan passes, so a failing lint/test/Trivy/cosign gate
  # blocks publishing, not just merging. GHCR (not a third-party
  # registry) since this repo is already on GitHub -- no new account or
  # secret to provision, GITHUB_TOKEN is enough to push here.
  publish-images:
    runs-on: ubuntu-latest
    needs: [security-code-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # BuildKit -- required for the per-Dockerfile
        # Dockerfile.dashboard.dockerignore convention Dockerfile.dashboard
        # relies on (plain `docker build` without Buildx ignores it and
        # falls back to the repo-root .dockerignore instead).
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image path
        # GHCR requires an all-lowercase repository path; github.repository
        # preserves the real case (chakri192/NeuralSOC).
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push the backend image (api/inference/kafka-sink)
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/tsoc-api:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/tsoc-api:latest

      - name: Build and push the dashboard image
        id: dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/tsoc-dashboard:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/tsoc-dashboard:latest

      - name: Print the real, digest-pinned image refs
        # k8s/'s Kyverno policy (kyverno-verify.yaml) requires every image
        # to be digest-pinned, not just tagged -- these are the real refs
        # a deploy step should write into the manifests (e.g. via
        # `kustomize edit set image`, see k8s-overlays/) in place of the
        # placeholder your-registry.com/tsoc/... digests. No deploy step
        # consumes this automatically yet -- there's no live cluster in
        # this repo to deploy to -- so it's recorded here for now.
        run: |
          echo "Backend image:   ${{ env.IMAGE_BASE }}/tsoc-api@${{ steps.backend.outputs.digest }}"
          echo "Dashboard image: ${{ env.IMAGE_BASE }}/tsoc-dashboard@${{ steps.dashboard.outputs.digest }}"

  # Every test above -- unit, integration, load -- calls process_traffic.fun()
  # directly with a fake async generator, or mocks Redis/Kafka entirely. None
  # of them go through Faust's real topic deserialization or a real TLS
  # handshake against the actual docker-compose services. Running the real
  # stack once, manually, immediately found three bugs no amount of mocked
  # testing could: value_type=dict crashing every message (faust-streaming
  # has no dict branch in its deserializer), Redis silently requiring mutual
  # TLS neither client was built to present, and the rate limiter's Redis
  # connection having no way to trust a custom CA. This job is that manual
  # check, automated, so the same class of bug can't silently reappear.
  integration-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate dev TLS certs for Redis
        run: scripts/generate_dev_certs.sh

      - name: Start Redpanda + Redis (real docker-compose services)
        # Written to $GITHUB_ENV, not this step's own env: -- values set
        # this way are automatically available as plain environment
        # variables in every later step in this job, which is what the
        # pipeline-startup and alert-assertion steps below rely on.
        run: |
          echo "TSOC_API_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "TSOC_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "COMPOSE_POSTGRES_USER=soc_admin" >> "$GITHUB_ENV"
          echo "COMPOSE_POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          set -a && source "$GITHUB_ENV" && set +a
          docker compose up -d redpanda redis

      - name: Wait for Redpanda and Redis to report healthy
        # This job's first real run got past Redpanda's own wait check
        # fine, then hit "Connection refused" on Redis from the Faust
        # worker moments later -- docker-compose.yml's redis service had
        # no healthcheck at all to wait on, so nothing here was actually
        # confirming it was ready before the pipeline started.
        run: |
          for svc in soc-redpanda soc-redis; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && echo "$svc healthy" && break
              sleep 3
              if [ "$i" = "30" ]; then
                echo "$svc never became healthy"; docker logs "$svc"; exit 1
              fi
            done
          done

      - name: Create Kafka topics
        run: scripts/create_topics.sh

      - name: Start the real pipeline (API, bootstrap a tenant, Faust worker, kafka_sink)
        run: |
          export DATABASE_URL="sqlite:///$(pwd)/tsoc_ci_smoke.db"
          export REDIS_SSL=true
          export REDIS_CA_CERT_PATH="$(pwd)/certs/ca.crt"
          # docker-compose.yml's redis service now enforces
          # --tls-auth-clients yes (real mutual TLS, not just server-side
          # encryption) -- without presenting a client cert here too,
          # every real connection from this job's api/inference processes
          # gets refused with "certificate required", the same failure
          # mode this repo hit once already before client certs existed
          # at all.
          export REDIS_CLIENT_CERT_PATH="$(pwd)/certs/client.crt"
          export REDIS_CLIENT_KEY_PATH="$(pwd)/certs/client.key"
          export DB_SSLMODE=verify-full
          export FAUST_DATADIR=/tmp/faust-ci-data
          export REDPANDA_BROKERS=localhost:9092
          export ENABLE_DOCS=false
          # inference/stream_processor_faust.py and api/kafka_sink.py both
          # run as direct script paths, not `python -m ...` -- Python then
          # puts each script's OWN directory on sys.path instead of the
          # repo root, so `from inference.features import ...` / `from
          # api.database import ...` fail with ModuleNotFoundError unless
          # PYTHONPATH is set explicitly. Found by this exact job failing
          # on its first real run -- also true of `make pipeline` (fixed
          # alongside this).
          export PYTHONPATH="$(pwd)"
          mkdir -p /tmp/faust-ci-data logs

          # API first -- kafka_sink now authenticates to it as a tenant's
          # ingest sensor (api/routes/ingest.py) rather than writing to
          # the database directly, so it needs a real sensor token minted
          # against a running API before it can even start.
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > logs/ci_api.log 2>&1 &
          for i in $(seq 1 20); do
            api_ok=$(curl -sf http://localhost:8000/healthz > /dev/null && echo yes || echo no)
            [ "$api_ok" = "yes" ] && echo "API healthy" && break
            sleep 2
            if [ "$i" = "20" ]; then echo "API did not become healthy in time"; cat logs/ci_api.log; exit 1; fi
          done

          # Bootstrap a tenant + admin + ingest sensor token -- the only
          # path around the auth system's own chicken-and-egg problem
          # (see scripts/bootstrap_tenant.py's own docstring: /auth/login
          # needs an existing user, invite needs an existing admin).
          python scripts/bootstrap_tenant.py \
            --api-url http://localhost:8000/api/v1 \
            --tenant-name "CI Smoke Test" \
            --email "ci-smoke@tsoc.internal" \
            --password "$(openssl rand -hex 16)" \
            > logs/ci_bootstrap.log 2>&1
          sensor_token=$(grep -oP 'TSOC_SENSOR_TOKEN=\K.*' logs/ci_bootstrap.log)
          if [ -z "$sensor_token" ]; then
            echo "FAIL: could not bootstrap a tenant/sensor token"; cat logs/ci_bootstrap.log; exit 1
          fi
          echo "TSOC_SENSOR_TOKEN=$sensor_token" >> "$GITHUB_ENV"
          export TSOC_SENSOR_TOKEN="$sensor_token"

          nohup python inference/stream_processor_faust.py worker -l info > logs/ci_faust.log 2>&1 &
          nohup python api/kafka_sink.py > logs/ci_kafka_sink.log 2>&1 &

          for i in $(seq 1 20); do
            faust_ok=$(curl -sf http://localhost:6066/healthz > /dev/null && echo yes || echo no)
            [ "$faust_ok" = "yes" ] && echo "Faust worker healthy" && exit 0
            sleep 2
          done
          echo "Faust worker did not become healthy in time"
          cat logs/ci_faust.log
          exit 1
        # TSOC_API_KEY / TSOC_JWT_SECRET / REDIS_PASSWORD need no explicit
        # env: mapping here -- values appended to $GITHUB_ENV in the
        # "Start Redpanda + Redis" step above are automatically exposed as
        # plain environment variables in every later step of this job.

      - name: Feed real synthetic attack traffic
        run: |
          export REDPANDA_BROKERS=localhost:9092
          timeout 25 python ingest/simulator.py --scenario mixed --burst > logs/ci_simulator.log 2>&1 || true
          # Each alert's enrichment makes a real outbound HTTPS call to
          # ipwho.is -- a CI runner's network path to it may have
          # different latency than a local dev machine's, so this leaves
          # more settle time than local manual testing needed.
          sleep 15

      - name: Assert real alerts actually landed (the point of this job)
        run: |
          resp=$(curl -sf "http://localhost:8000/api/v1/alerts?limit=10" -H "Authorization: Bearer ${TSOC_API_KEY}")
          count=$(echo "$resp" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Alerts returned by the real API: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: real synthetic traffic through the real pipeline produced zero alerts"
            echo "--- simulator log ---"; cat logs/ci_simulator.log
            echo "--- Faust log (tail) ---"; tail -100 logs/ci_faust.log
            echo "--- kafka_sink log (tail) ---"; tail -100 logs/ci_kafka_sink.log
            exit 1
          fi
          echo "PASS: the real pipeline (Redpanda -> Faust -> Redis correlation -> kafka_sink -> Postgres/API) produced $count real alert(s)"

      - name: Dump logs (always, for debugging)
        if: always()
        run: |
          echo "--- API ---"; tail -50 logs/ci_api.log 2>&1 || true
          echo "--- Faust ---"; tail -50 logs/ci_faust.log 2>&1 || true
          echo "--- kafka_sink ---"; tail -50 logs/ci_kafka_sink.log 2>&1 || true

      - name: Tear down
        if: always()
        run: docker compose down -v

  # docs/DISASTER_RECOVERY.md documents scripts/backup_postgres.sh /
  # restore_postgres.sh as the actual DR procedure -- a runbook nobody has
  # ever exercised is just a hope, not a plan. This proves the mechanism
  # (not a production-scale rehearsal, see that doc's own "out of scope"
  # section) on every push: create real data, back it up, wipe the
  # database, restore, and assert the data actually came back unchanged.
  # A plain GitHub Actions service container (not docker-compose.yml's
  # postgres) since this only needs an isolated Postgres, not the rest of
  # the stack integration-smoke-test above already covers.
  backup-restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: drill_user
          POSTGRES_PASSWORD: drill_pass
          POSTGRES_DB: tsoc_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: drill_pass
      DATABASE_URL: postgresql://drill_user:drill_pass@localhost:5432/tsoc_drill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install postgresql-client (pg_dump/pg_restore/psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create real test data
        run: |
          psql -h localhost -U drill_user -d tsoc_drill -c \
            "CREATE TABLE drill_alerts (id SERIAL PRIMARY KEY, alert_id TEXT UNIQUE NOT NULL, payload TEXT NOT NULL);"
          psql -h localhost -U drill_user -d tsoc_drill -c \
            "INSERT INTO drill_alerts (alert_id, payload) VALUES ('ALT-1', 'test-payload-1'), ('ALT-2', 'test-payload-2'), ('ALT-3', 'test-payload-3');"

      - name: Backup
        run: echo "BACKUP_FILE=$(scripts/backup_postgres.sh)" >> "$GITHUB_ENV"

      - name: Wipe the database
        run: psql -h localhost -U drill_user -d tsoc_drill -c "DROP TABLE drill_alerts;"

      - name: Confirm the wipe actually happened (sanity-check the drill itself)
        run: |
          if psql -h localhost -U drill_user -d tsoc_drill -c "SELECT 1 FROM drill_alerts LIMIT 1;" 2>/dev/null; then
            echo "Table still exists after DROP -- this drill isn't testing anything real"
            exit 1
          fi

      - name: Restore
        run: scripts/restore_postgres.sh "$BACKUP_FILE"

      - name: Verify restored data matches exactly
        run: |
          COUNT=$(psql -h localhost -U drill_user -d tsoc_drill -tAc "SELECT COUNT(*) FROM drill_alerts;")
          if [ "$COUNT" != "3" ]; then
            echo "FAIL: expected 3 rows after restore, got $COUNT"
            exit 1
          fi
          PAYLOAD=$(psql -h localhost -U drill_user -d tsoc_drill -tAc "SELECT payload FROM drill_alerts WHERE alert_id='ALT-2';")
          if [ "$PAYLOAD" != "test-payload-2" ]; then
            echo "FAIL: restored payload mismatch for ALT-2: got '$PAYLOAD'"
            exit 1
          fi
          echo "PASS: backup -> wipe -> restore preserved 3 rows with matching content."

  # Every fallback path this session added or hardened (correlation.py's
  # graceful check_redis_master()/add_alert() degradation, kafka_sink.py's
  # bulk-upsert-fails-fall-back-to-per-item loop) is unit-tested against
  # MOCKED failures. Mocks can't prove the real thing behaves the same way
  # -- three real bugs this session (Faust deserialization, Redis mutual-
  # TLS default, rate-limiter CA trust) were only ever found by actually
  # running the real stack, never by a mock. This job kills a real
  # dependency mid-run, the same way integration-smoke-test above proves
  # the happy path, and is kept as its own job specifically so a chaos-test
  # flake never blocks that job's fast, reliable signal.
  #
  # Assertions here are deliberately outcome-based (does the pipeline
  # survive and keep making progress) rather than exact-log-line matches:
  # the precise error path SQLite/Redis take under a given failure
  # injection is a real implementation detail that can legitimately shift
  # release to release without the underlying resilience guarantee
  # (nothing crashes, nothing permanently wedges) actually regressing.
  chaos-resilience-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate dev TLS certs for Redis
        run: scripts/generate_dev_certs.sh

      - name: Start Redpanda + Redis (real docker-compose services)
        run: |
          echo "TSOC_API_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "TSOC_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "COMPOSE_POSTGRES_USER=soc_admin" >> "$GITHUB_ENV"
          echo "COMPOSE_POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          set -a && source "$GITHUB_ENV" && set +a
          docker compose up -d redpanda redis

      - name: Wait for Redpanda and Redis to report healthy
        run: |
          for svc in soc-redpanda soc-redis; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo "starting")
              [ "$status" = "healthy" ] && echo "$svc healthy" && break
              sleep 3
              if [ "$i" = "30" ]; then
                echo "$svc never became healthy"; docker logs "$svc"; exit 1
              fi
            done
          done

      - name: Create Kafka topics
        run: scripts/create_topics.sh

      - name: Start the real pipeline (API, bootstrap a tenant, Faust worker, kafka_sink)
        run: |
          export DATABASE_URL="sqlite:///$(pwd)/tsoc_chaos.db"
          export REDIS_SSL=true
          export REDIS_CA_CERT_PATH="$(pwd)/certs/ca.crt"
          export REDIS_CLIENT_CERT_PATH="$(pwd)/certs/client.crt"
          export REDIS_CLIENT_KEY_PATH="$(pwd)/certs/client.key"
          export DB_SSLMODE=verify-full
          export FAUST_DATADIR=/tmp/faust-chaos-data
          export REDPANDA_BROKERS=localhost:9092
          export ENABLE_DOCS=false
          export PYTHONPATH="$(pwd)"
          mkdir -p /tmp/faust-chaos-data logs

          # API first -- kafka_sink now authenticates to it as a tenant's
          # ingest sensor (api/routes/ingest.py) rather than writing to
          # the database directly, so it needs a real sensor token minted
          # against a running API before it can even start.
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > logs/chaos_api.log 2>&1 &
          echo $! > /tmp/chaos_api.pid
          for i in $(seq 1 20); do
            api_ok=$(curl -sf http://localhost:8000/healthz > /dev/null && echo yes || echo no)
            [ "$api_ok" = "yes" ] && echo "API healthy" && break
            sleep 2
            if [ "$i" = "20" ]; then echo "API did not become healthy in time"; cat logs/chaos_api.log; exit 1; fi
          done

          # Bootstrap a tenant + admin + ingest sensor token -- the only
          # path around the auth system's own chicken-and-egg problem
          # (see scripts/bootstrap_tenant.py's own docstring: /auth/login
          # needs an existing user, invite needs an existing admin).
          python scripts/bootstrap_tenant.py \
            --api-url http://localhost:8000/api/v1 \
            --tenant-name "CI Chaos Test" \
            --email "ci-chaos@tsoc.internal" \
            --password "$(openssl rand -hex 16)" \
            > logs/chaos_bootstrap.log 2>&1
          sensor_token=$(grep -oP 'TSOC_SENSOR_TOKEN=\K.*' logs/chaos_bootstrap.log)
          if [ -z "$sensor_token" ]; then
            echo "FAIL: could not bootstrap a tenant/sensor token"; cat logs/chaos_bootstrap.log; exit 1
          fi
          echo "TSOC_SENSOR_TOKEN=$sensor_token" >> "$GITHUB_ENV"
          export TSOC_SENSOR_TOKEN="$sensor_token"

          nohup python inference/stream_processor_faust.py worker -l info > logs/chaos_faust.log 2>&1 &
          echo $! > /tmp/chaos_faust.pid
          nohup python api/kafka_sink.py > logs/chaos_kafka_sink.log 2>&1 &
          echo $! > /tmp/chaos_kafka_sink.pid

          for i in $(seq 1 20); do
            faust_ok=$(curl -sf http://localhost:6066/healthz > /dev/null && echo yes || echo no)
            [ "$faust_ok" = "yes" ] && echo "Faust worker healthy" && exit 0
            sleep 2
          done
          echo "Faust worker did not become healthy in time"
          cat logs/chaos_faust.log
          exit 1

      - name: Baseline -- feed traffic and confirm alerts flow normally
        run: |
          export REDPANDA_BROKERS=localhost:9092
          timeout 20 python ingest/simulator.py --scenario mixed --burst > logs/chaos_simulator_baseline.log 2>&1 || true
          sleep 15
          # /api/v1/stats' total_alerts (not /api/v1/alerts?limit=100's
          # response length, which caps at 100 and would make every later
          # "did the count increase" check unwinnable once baseline
          # traffic alone reaches that cap).
          count=$(curl -sf "http://localhost:8000/api/v1/stats" -H "Authorization: Bearer ${TSOC_API_KEY}" | python3 -c "import json,sys; print(json.load(sys.stdin)['total_alerts'])")
          echo "BASELINE_COUNT=$count" >> "$GITHUB_ENV"
          echo "Baseline alert count: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: baseline produced zero alerts -- chaos assertions below would be meaningless"
            exit 1
          fi

      - name: "Chaos 1/2 -- kill Redis mid-run, verify the pipeline degrades gracefully instead of crashing"
        run: |
          echo "==> Stopping soc-redis"
          docker compose stop redis

          export REDPANDA_BROKERS=localhost:9092
          timeout 15 python ingest/simulator.py --scenario mixed --burst > logs/chaos_simulator_redis_down.log 2>&1 || true
          sleep 8

          # The real assertion: the Faust worker (which owns the Redis
          # connection via inference/correlation.py) must not have crashed.
          # correlation.py's check_redis_master()/add_alert() are supposed
          # to catch redis.RedisError and degrade gracefully -- if that
          # regressed, the whole process dies here instead of surviving.
          if ! kill -0 "$(cat /tmp/chaos_faust.pid)" 2>/dev/null; then
            echo "FAIL: Faust worker process died while Redis was down"
            cat logs/chaos_faust.log
            exit 1
          fi
          if ! curl -sf http://localhost:6066/healthz > /dev/null; then
            echo "FAIL: Faust worker's /healthz stopped responding while Redis was down"
            exit 1
          fi
          echo "PASS: Faust worker survived Redis outage (process alive, /healthz still responding)"

          # Informational, not a hard gate -- the exact log line depends on
          # whether Redis died between check_redis_master() calls (clean,
          # logged "Redis connection error") or mid-command (raises,
          # DLQ'd as "RedisUnavailable"). Either is correct; only a crash
          # or silent hang would be a real regression.
          grep -E "Redis connection error|RedisUnavailable" logs/chaos_faust.log && \
            echo "(informational) found expected Redis-outage handling in the Faust log" || \
            echo "(informational) no explicit Redis-outage log line yet -- not a failure by itself, see the process/healthz checks above"

          echo "==> Restarting soc-redis"
          docker compose start redis
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' soc-redis 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && echo "soc-redis healthy again" && break
            sleep 3
            if [ "$i" = "20" ]; then echo "soc-redis never came back healthy"; docker logs soc-redis; exit 1; fi
          done

          timeout 20 python ingest/simulator.py --scenario mixed --burst > logs/chaos_simulator_redis_recovered.log 2>&1 || true
          sleep 15
          recovered_count=$(curl -sf "http://localhost:8000/api/v1/stats" -H "Authorization: Bearer ${TSOC_API_KEY}" | python3 -c "import json,sys; print(json.load(sys.stdin)['total_alerts'])")
          echo "Alert count after Redis recovery: $recovered_count (was $BASELINE_COUNT before this chaos step)"
          if [ "$recovered_count" -le "$BASELINE_COUNT" ]; then
            echo "FAIL: alert count did not increase after Redis recovered -- pipeline may be permanently wedged"
            exit 1
          fi
          echo "PASS: alert flow resumed and grew after Redis recovered"
          echo "POST_REDIS_COUNT=$recovered_count" >> "$GITHUB_ENV"

      - name: "Chaos 2/2 -- make the DB read-only mid-run, verify kafka_sink survives and self-heals"
        run: |
          echo "==> Revoking write access to the SQLite DB file"
          chmod 444 "$(pwd)/tsoc_chaos.db"

          export REDPANDA_BROKERS=localhost:9092
          timeout 15 python ingest/simulator.py --scenario mixed --burst > logs/chaos_simulator_db_down.log 2>&1 || true
          sleep 8

          # The real assertion: kafka_sink.py's outer batch-level exception
          # handler (and the bulk-upsert-fails-falls-back-to-per-item path)
          # exist specifically so a DB write failure rolls back and retries
          # the batch instead of crashing the consumer.
          if ! kill -0 "$(cat /tmp/chaos_kafka_sink.pid)" 2>/dev/null; then
            echo "FAIL: kafka_sink process died when the database became read-only"
            cat logs/chaos_kafka_sink.log
            exit 1
          fi
          echo "PASS: kafka_sink survived the database write failure (process still alive)"

          # Informational -- SQLite's exact error surfaces at whichever
          # point it first attempts a write (bulk insert/update, or the
          # final commit), which this test doesn't control precisely.
          grep -E "Bulk upsert failed|Batch DB commit failure|Item DB write failed" logs/chaos_kafka_sink.log && \
            echo "(informational) found expected DB-write-failure handling in the kafka_sink log" || \
            echo "(informational) no explicit DB-failure log line yet -- not a failure by itself, see the process-alive check above"

          echo "==> Restoring write access to the SQLite DB file"
          chmod 644 "$(pwd)/tsoc_chaos.db"

          timeout 20 python ingest/simulator.py --scenario mixed --burst > logs/chaos_simulator_db_recovered.log 2>&1 || true
          sleep 15
          final_count=$(curl -sf "http://localhost:8000/api/v1/stats" -H "Authorization: Bearer ${TSOC_API_KEY}" | python3 -c "import json,sys; print(json.load(sys.stdin)['total_alerts'])")
          echo "Alert count after DB recovery: $final_count (was $POST_REDIS_COUNT before this chaos step)"
          if [ "$final_count" -le "$POST_REDIS_COUNT" ]; then
            echo "FAIL: alert count did not increase after DB write access was restored -- batch retry may not be working"
            exit 1
          fi
          echo "PASS: alert flow resumed and grew after DB write access was restored -- no permanent stall from either failure"

      - name: Dump logs (always, for debugging)
        if: always()
        run: |
          for f in logs/chaos_*.log; do
            echo "--- $f (tail) ---"; tail -60 "$f" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
