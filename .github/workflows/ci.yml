name: TSOC CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit


      - name: Run Unit Tests
        run: |
          pip install pytest
          pytest tests/

      - name: Run Bandit Python Static Analysis
        run: |
          bandit -r . -x tests,docs,.github,venv --format json -o bandit-report.json
          bandit -r . -x tests,docs,.github,venv --severity-level low  # Fails the build if any issue exists

      - name: Upload Bandit results
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Build image
        run: docker build -t tsoc:latest .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.14.0
        with:
          image-ref: 'tsoc:latest'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          format: "json"
          output: "trivy-report.json"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: 1

      - name: Upload Trivy results
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.json
